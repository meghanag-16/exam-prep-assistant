[project]
name = "examprep"
version = "0.1.0"
description = "Full-coverage exam-prep assistant over your own course material"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "huggingface-hub>=0.24",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.40",
    "pymupdf>=1.24",
    "python-pptx>=1.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Windows only: lets old .ppt files be converted with your installed PowerPoint.
windows-ppt = ["pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
examprep-check = "examprep.check:main"
examprep-ingest = "examprep.cli:ingest_main"
examprep-report = "examprep.cli:report_main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/examprep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
