[project]
name = "examprep"
version = "0.1.0"
description = "Full-coverage exam-prep assistant over your own course material"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "huggingface-hub>=0.24",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.40",
    "pymupdf>=1.24",
    "python-pptx>=1.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Windows only: lets old .ppt files be converted with your installed PowerPoint.
windows-ppt = ["pywin32>=306; sys_platform == 'win32'"]
# Better similarity with a sentence-embedding model. Installed on Kaggle and the
# Space; not needed on the laptop (a lightweight TF-IDF method is used there).
ml = ["sentence-transformers>=3.0"]

[project.scripts]
examprep-check = "examprep.check:main"
examprep-ingest = "examprep.cli:ingest_main"
examprep-report = "examprep.cli:report_main"
examprep-topics = "examprep.cli:topics_main"
examprep-formulas = "examprep.cli:formulas_main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/examprep"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F/W: errors and style, I: import order, B: likely bugs, UP: modern syntax,
# S: security checks (bandit rules)
select = ["E", "F", "W", "I", "B", "UP", "S"]
# S603/S607: subprocess with fixed argument lists; S608: SQL built only from "?" placeholders;
# S110/S112: deliberate skip of one unreadable image/file; B008: FastAPI's File()/Form() pattern
ignore = ["S101", "S603", "S607", "S608", "S110", "S112", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"deploy/*" = ["S602", "S605"]
