# Grounded answers, notes and quick revision.

answer:
  default_marks: 5
  # Passages given to the model for each mark level (after the search cuts in
  # config/search.yaml, so weak matches are already left out).
  passages: {2: 3, 4: 4, 5: 5, 6: 6, 7: 6, 8: 7, 10: 8, 15: 10}
  # Regenerations when a check fails (bad citation, uncited point, too generic, wrong length).
  max_attempts: 2
  # Anti-generic check: this share of the key terms of the cited passages must appear in the answer.
  key_terms: 10
  min_term_share: 0.3
  # Lines shorter than this (headings, labels) need no citation.
  min_line_words: 6
  # A length check only catches answers far outside the word budget in exam_pattern.yaml.
  length_tolerance: 0.5
  # Self-check pass (compare the draft with the passages, remove contradictions and filler):
  # always | deeper (only with extra explanations) | never
  self_check: deeper
  # Repeated questions are answered from the ledger while the index and settings are unchanged.
  cache: true
  # When your slides do not cover a question, the answer says so and then answers from outside:
  #   trusted_then_general: trusted-site passages, or else the model's general knowledge (labelled)
  #   trusted: trusted-site passages only (otherwise just "not in your slides")
  #   none: only "not in your slides"
  outside_answer: trusted_then_general
  # With a syllabus loaded (examprep-topics --syllabus), every answer says when the question
  # is not in the syllabus.
  syllabus_check: true
  syllabus_candidates: 12   # closest syllabus points shown to the model for the check

trusted:
  # "Beyond your slides" passages from the sites in trusted_sites.yaml (Tavily search).
  max_results: 5          # search results per question
  max_passages: 4         # passages that pass the relevance gate and go to the model
  passage_words: 180
  fetch_timeout: 8         # seconds per page; slow sites are skipped
  cache_days: 30

notes:
  batch_pages: 4          # most pages per notes request (3 to 5 keeps each page in focus)
  batch_words: 1500       # most words per notes request, so dense pages go a few at a time
  max_page_words: 900     # a longer page is sent in parts (nothing is cut off)
  max_retries: 2          # extra requests for pages left uncovered or too thin
  page_terms: 5           # key terms checked per page
  min_term_share: 0.4     # share of a page's key terms its notes must contain
  page_details: 8         # specific details checked per page (numbers, rare names and terms)
  min_detail_share: 0.5   # share of those rare names and terms its notes must contain (numbers: all)
  repeat_share: 0.8       # a point is dropped as a repeat only if this share of its words is in the kept one
  marker_facts: 20        # facts planted by the coverage marker test

revision:
  keywords: 12
  short_points: 10

evaluation:
  max_questions: 20       # in-material questions answered
  max_outside_questions: 5  # outside questions answered (each searches trusted sites and reads pages)
  deeper_questions: 2     # questions also answered with extra explanations (uses search credits)
  fresh_llm_calls: true   # answer without the LLM reply cache, so latency and tokens are real (uses quota)
  ragas_questions: 10     # answers scored with RAGAS (about 6 judge calls each); 0 turns it off
  ragas_provider:         # judge provider from models.yaml tried first; empty = models.yaml order
  ragas_rate_limit_wait: 30  # seconds to wait once when the judge is rate-limited, before trying the next judge
  ragas_max_tokens: 4096  # longest judge reply; RAGAS default 1024 cuts off faithfulness
