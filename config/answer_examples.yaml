# A mark level without its own example uses the nearest one (4 uses 5, 8 uses 10).

2: |
  **Cache memory** is a small, fast memory between the processor and main memory that keeps copies of recently used data [S1].
  - It reduces the average time to reach memory because most requests are served from it [S1].
  - A request found in the cache is a hit; one that is not is a miss [S2].

5: |
  **Pipelining** splits instruction execution into stages so that several instructions are processed at the same time, each in a different stage [S1].

  - **Stages:** a classic pipeline has fetch, decode, execute, memory access and write back [S1].
  - **Throughput:** once the pipeline is full, one instruction finishes every cycle, although each instruction still takes several cycles [S2].
  - **Hazards:** structural, data and control hazards can stall the pipeline [S2].
  - **Remedies:** forwarding removes many data stalls, and branch prediction reduces control stalls [S3].

  **Example:** with five stages, ten instructions take 14 cycles instead of 50 [S2].

