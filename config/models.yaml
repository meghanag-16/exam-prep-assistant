# LLM providers, tried in this order. All are free tiers.
# Model names and free limits change often: run `uv run examprep-check`
# to confirm each configured model is actually listed by the provider.
llm:
  # Text requests try these in order. Gemini goes first because its Flash-Lite models allow
  # the most on the free tier (15 a minute, 500 a day and 250K tokens a minute each, in AI
  # Studio > Usage), and it is the only provider for images (formula pictures and scanned
  # pages always go to providers with vision: true). The others take over when it is limited.
  order: [gemini, groq, openrouter, nvidia, gemma]
  providers:
    gemini:
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      api_key_env: GEMINI_API_KEY
      # Tried in this order: when one model's free quota runs out, the next is used.
      # Each Gemini model has its own free quota. All listed models must accept images.
      # Free limits from AI Studio > Usage > Rate limits by model (RPM = requests a minute,
      # RPD = requests a day), as shown on 2026-11-28. The Flash models allow only 20 a day,
      # so the Flash-Lite models (500 a day) come first and the Flash models are kept as spares.
      models:
        - gemini-3.5-flash-lite   # 15 a minute, 500 a day
        - gemini-3.1-flash-lite   # 15 a minute, 500 a day
        - gemini-2.5-flash-lite   # limit not checked
        - gemini-3.8-flash        # 5 a minute, 20 a day
        - gemini-3.6-flash        # 5 a minute, 20 a day
        - gemini-4-hydrogen       # 5 a minute, 20 a day
        - gemini-2.5-flash        # 5 a minute, 20 a day
      vision: true
      requests_per_minute: 5    # default per model; requests are spaced so this is not exceeded
      model_requests_per_minute:
        gemini-3.5-flash-lite: 15
        gemini-3.1-flash-lite: 15
    groq:
      base_url: https://api.groq.com/openai/v1/
      api_key_env: GROQ_API_KEY
      # Free chat models on Groq (from examprep-check, 2026-11-27), tried in order. Names change: `uv run examprep-check` lists the ones your key sees.
      models:
        - openai/gpt-oss-120b
        - qwen/qwen3.8-27b
        - openai/gpt-oss-20b
        - allam-2-7b              # small model, last resort
      vision: false
      requests_per_minute: 30
    openrouter:
      base_url: https://openrouter.ai/api/v1/
      api_key_env: OPENROUTER_API_KEY
      # Free (":free") chat models on OpenRouter (from examprep-check, 2026-11-27), tried in order. `uv run examprep-check` lists the ones available.
      models:
        - google/gemma-4-31b-it:free
        - nvidia/nemotron-3-ultra-550b-a55b:free
        - google/gemma-4-26b-a4b-it:free
        - nvidia/nemotron-3.5-super-vl:free
        - baidu/ernie-5.5-flash-preview:free
        - nvidia/nemotron-3.5-lightning:free
      vision: false
      requests_per_minute: 20
    nvidia:
      # Optional: free endpoints on build.nvidia.com (filter "Free Endpoint"). Add NVIDIA_API_KEY
      # to .env and Kaggle Secrets to use it; without the key it is skipped.
      # Model names below come from the build.nvidia.com page and are not verified yet:
      # `uv run examprep-check` lists the names your key really sees.
      base_url: https://integrate.api.nvidia.com/v1/
      api_key_env: NVIDIA_API_KEY
      optional: true
      models:
        - mistralai/mistral-large-4-1t-a52b
        - moonshotai/kimi-k3.1-pro
      vision: false
      requests_per_minute: 30
    gemma:
      # Gemma on the Gemini API key: a separate free quota (30 a minute, 14,400 a day, but only
      # 16,000 tokens a minute in AI Studio > Usage), used for text only. Model name not verified: check with examprep-check.
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      api_key_env: GEMINI_API_KEY
      models:
        - gemma-4-26b-a4b-it
      vision: false
      requests_per_minute: 30
  timeout_seconds: 60
  max_retries: 1             # extra tries on the same model (timeouts, server errors) before the next model
  cache:
    enabled: true           # answer repeated requests from data/llm_cache.sqlite (synced to the dataset repo)
    days: 60                # cached replies older than this are asked again
  quota_rest_seconds: 300   # a model whose quota ran out is skipped this long (or as long as the provider asks)

embeddings:
  model: BAAI/bge-small-en-v1.5
  batch_size: 64

reranker:
  model: BAAI/bge-reranker-base
  # lighter, faster CPU alternative:
  # model: cross-encoder/ms-marco-MiniLM-L-6-v2

trusted_search:
  provider: tavily
  api_key_env: TAVILY_API_KEY
  max_results: 5

# Langfuse tracing (on when LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY are set).
# log_content: true shows questions, passages, prompts and answers in each trace, so a trace
#   shows exactly what the model was given (e-mail addresses, phone numbers and API keys are
#   always removed before sending). Set it to false to send only models, token counts,
#   timings and sizes, for material you may not share with Langfuse.
# sample_rate: share of traces sent, 0 to 1 (1 = all).
tracing:
  log_content: true
  sample_rate: 1.0
