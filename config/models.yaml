# LLM providers, tried in this order. All are free tiers.
# Model names and free limits change often: run `uv run examprep-check`
# to confirm each configured model is actually listed by the provider.
llm:
  order: [gemini, groq, openrouter]
  providers:
    gemini:
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      api_key_env: GEMINI_API_KEY
      # Tried in this order: when one model's free quota runs out, the next is used.
      # Each Gemini model has its own free quota. All listed models must accept images.
      # Only models with a free quota (AI Studio > Usage, RPM / RPD) are listed; free daily requests in brackets.
      models:
        - gemini-3.8-flash        # 20 a day
        - gemini-3.6-flash        # 20 a day
        - gemini-4-hydrogen       # 20 a day
        - gemini-2.5-flash        # 20 a day
        - gemini-3.5-flash-lite   # 500 a day
        - gemini-3.1-flash-lite   # 500 a day
        - gemini-2.5-flash-lite
      vision: true
      requests_per_minute: 5    # free tier per model; requests are spaced so this is not exceeded
    groq:
      base_url: https://api.groq.com/openai/v1/
      api_key_env: GROQ_API_KEY
      # Free models on Groq, tried in order. Names change: `uv run examprep-check` lists the ones your key sees.
      models:
        - openai/gpt-oss-120b
        - llama-3.3-70b-versatile
        - openai/gpt-oss-20b
        - qwen/qwen3-32b
        - meta-llama/llama-4-scout-17b-16e-instruct
        - llama-3.1-8b-instant
      vision: false
      requests_per_minute: 30
    openrouter:
      base_url: https://openrouter.ai/api/v1/
      api_key_env: OPENROUTER_API_KEY
      # Free (":free") models on OpenRouter, tried in order. `uv run examprep-check` lists the ones available.
      models:
        - google/gemma-4-31b-it:free
        - meta-llama/llama-3.3-70b-instruct:free
        - deepseek/deepseek-chat-v3-0324:free
        - qwen/qwen3-235b-a22b:free
        - mistralai/mistral-small-3.2-24b-instruct:free
      vision: false
      requests_per_minute: 20
  timeout_seconds: 60
  max_retries: 2
  cache:
    enabled: true           # answer repeated requests from data/llm_cache.sqlite (synced to the dataset repo)
    days: 60                # cached replies older than this are asked again
  quota_rest_seconds: 300   # a model whose quota ran out is skipped this long (or as long as the provider asks)

embeddings:
  model: BAAI/bge-small-en-v1.5
  batch_size: 64

reranker:
  model: BAAI/bge-reranker-base
  # lighter, faster CPU alternative:
  # model: cross-encoder/ms-marco-MiniLM-L-6-v2

trusted_search:
  provider: tavily
  api_key_env: TAVILY_API_KEY
  max_results: 5
