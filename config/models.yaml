# LLM providers, tried in this order. All are free tiers.
# Model names and free limits change often: run `uv run examprep-check`
# to confirm each configured model is actually listed by the provider.
llm:
  order: [gemini, groq, openrouter]
  providers:
    gemini:
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      api_key_env: GEMINI_API_KEY
      # Tried in this order: when one model's free quota runs out, the next is used.
      # Each Gemini model has its own free quota. All listed models must accept images.
      # Only models with a free quota (AI Studio > Usage, RPM / RPD) are listed; free daily requests in brackets.
      models:
        - gemini-3.8-flash        # 20 a day
        - gemini-3.6-flash        # 20 a day
        - gemini-4-hydrogen       # 20 a day
        - gemini-2.5-flash        # 20 a day
        - gemini-3.5-flash-lite   # 500 a day
        - gemini-3.1-flash-lite   # 500 a day
        - gemini-2.5-flash-lite
      vision: true
    groq:
      base_url: https://api.groq.com/openai/v1/
      api_key_env: GROQ_API_KEY
      model: openai/gpt-oss-120b
      vision: false
    openrouter:
      base_url: https://openrouter.ai/api/v1/
      api_key_env: OPENROUTER_API_KEY
      model: google/gemma-4-31b-it:free
      vision: false
  timeout_seconds: 60
  max_retries: 2
  quota_rest_seconds: 300   # a model whose quota ran out is skipped this long (or as long as the provider asks)

embeddings:
  model: BAAI/bge-small-en-v1.5
  batch_size: 64

reranker:
  model: BAAI/bge-reranker-base
  # lighter, faster CPU alternative:
  # model: cross-encoder/ms-marco-MiniLM-L-6-v2

trusted_search:
  provider: tavily
  api_key_env: TAVILY_API_KEY
  max_results: 5
